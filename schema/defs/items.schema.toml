  "record: u32 highalch",
  "record: u32 lowalch",
  "record: u32 value",
  "record: u32 linked_id_item, linked_id_noted, linked_id_placeholder, buy_limit (v2)",
  "record: u32 wear_model_ids[7] (v2)",
  "record: u16 metadata_flags, i8 wearpos[3], u16 equip_conflicts (v3)",
  "record: pstr8 inventory_actions[5], ground_actions[5], examine (v3)",
  "optional equipment block: u8 slot, u8 req_count, u8 combat_level (v3), reqs, i16 bonuses[14]",
