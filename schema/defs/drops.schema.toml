id = "drops"
format = "binary"
path = "data/defs/drops.bin"
magic_label = "DROP"
magic_u32 = "0x504F5244"
current_version = 2
accepted_versions = [2]
endianness = "little"
header = ["u32 magic", "u32 version", "u32 count"]
producer = "tools/export_runtime_snapshots.py"
consumers = ["rc-core/drops.c"]
source_dataset = "Owned v1 snapshot plus content/loot/rejections.json; non-rejected legacy probabilities NOT yet verified"
row_fields = [
  "u32 npc_id",
  "u32 rejection_flags: bit 0 unpublished rate, bit 1 outdated drop source; unknown bits rejected",
  "always: u8 count, entries[count]: u32 item_id, u16 qmin, u16 qmax",
  "main: u8 count, entries[count]: u32 item_id, u16 qmin, u16 qmax, u32 rarity_inv",
  "tertiary: u8 count, entries[count]: u32 item_id, u16 qmin, u16 qmax, u32 rarity_inv",
  "u32 rare_table_weight",
]
compatibility = "Loader accepts exactly v2. Rejected tables must have zero group counts and zero rare_table_weight; rolls fail explicitly before RNG/grants. Shared RDT/GDT/MRDT assets remain v1 pending exact-roll migration."
