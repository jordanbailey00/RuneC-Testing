id = "spells"
format = "binary"
path = "data/defs/spells.bin"
magic_label = "SPEL"
magic_u32 = "0x4C455053"
current_version = 2
accepted_versions = [1, 2]
endianness = "little"
header = ["u32 magic", "u32 version", "u32 count"]
producer = "tools/export_spells.py"
consumers = ["rc-core/spells.c"]
source_dataset = "RuneC-owned spell table"
row_fields = [
  "pstr8 name",
  "u8 book",
  "u8 type",
  "u8 level",
  "u8 slayer_level",
  "u16 xp_q1",
  "u8 flags",
  "u16 max_hit, u16 effect_flags (v2+)",
  "u8 rune_count",
  "runes[rune_count]: u32 item_id, u8 quantity",
]
compatibility = "Loader accepts versions 1 and 2 atomically; invalid data leaves the prior table intact. Exporter preserves installed v2 (book,name) row order."
validation = "At most 512 rows; unique (book,name), nonempty NUL-free names under 64 bytes; book 0..4, type 0..7, level 1..99, Slayer 0..99, membership flag 0/1, known effect bits; at most 8 unique positive item IDs/quantities; exact payload length. Loaded item data validates cost references. Type 0 is explicitly unsupported, not an executor."
