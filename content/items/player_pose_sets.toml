schema_version = 1

# RuneC-owned player base-animation data for the weapon models exported by the
# first-release viewer. Item IDs and names are reconciled against RuneC's B237
# definitions during export. Pose values were reviewed from the modern OSRS
# B233 cache-enricher evidence; the reference repository is not an input or a
# dependency. A value of -1 intentionally retains the normal human animation
# for that movement state.

